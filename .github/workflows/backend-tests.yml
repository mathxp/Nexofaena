name: Backend tests

# Corre los 50 tests de backend en cada push/PR a main — antes de esto,
# solo corrían cuando alguien se acordaba de correrlos a mano, así que una
# regresión podía llegar a producción sin que nadie la notara hasta que
# fallara en vivo.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexofaena
          POSTGRES_PASSWORD: nexofaena
          POSTGRES_DB: nexofaena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Todo con valores de prueba, sin secretos reales: TELEGRAM_BOT_TOKEN
      # queda vacío a propósito — los tests que tocan el bot mockean la
      # llamada real o desactivan las notificaciones explícitamente.
      DATABASE_URL: postgresql://nexofaena:nexofaena@localhost:5432/nexofaena_test
      SECRET_KEY: clave-de-pruebas-solo-para-ci
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        run: >
          python manage.py test
          nexofaena.tests.test_entrega_service
          nexofaena.tests.test_trabajador_views
          nexofaena.tests.test_telegram_bot_service
          nexofaena.tests.test_notificacion_service
          nexofaena.tests.test_signals
          nexofaena.tests.test_telegram_webhook
          nexofaena.tests.test_crear_admin
